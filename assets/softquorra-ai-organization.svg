<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SoftQuorra AI Organization System</title>
  <desc id="desc">Animated banner showing GPT skills, Codex skills, AI agents, SaaS, software, and organization automation connected around SoftQuorra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#0e2f36"/>
      <stop offset="100%" stop-color="#132019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 54px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .small { font: 500 15px Arial, Helvetica, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .pill { font: 700 16px Arial, Helvetica, sans-serif; fill: #06131f; letter-spacing: 0; }
      .line { stroke: url(#accent); stroke-width: 2.5; stroke-linecap: round; opacity: 0.75; }
      .dash { stroke-dasharray: 8 10; animation: dash 18s linear infinite; }
      @keyframes dash {
        to { stroke-dashoffset: -180; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 310 C190 260 275 392 460 335 C610 289 718 214 908 253 C1055 283 1125 232 1200 196 L1200 420 L0 420 Z" fill="#0f766e" opacity="0.18"/>
  <path d="M0 110 C182 46 329 160 500 114 C684 64 777 49 948 96 C1058 126 1130 98 1200 69" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
  <path d="M0 342 C174 294 320 357 476 303 C646 244 767 294 914 263 C1060 232 1120 240 1200 220" fill="none" stroke="#34d399" stroke-width="2" opacity="0.22"/>

  <g transform="translate(72 64)">
    <rect x="0" y="0" width="142" height="34" rx="17" fill="url(#accent)"/>
    <text x="19" y="23" class="pill">SoftQuorra</text>
    <text x="0" y="84" class="title">GPT Skills</text>
    <text x="0" y="142" class="title">for Organization</text>
    <text x="2" y="188" class="subtitle">AI agents, Codex skills, SaaS, and automation</text>
    <text x="2" y="226" class="small">Created by SoftQuorra for teams building real AI-enabled operating systems.</text>
    <g transform="translate(0 268)">
      <rect x="0" y="0" width="244" height="46" rx="23" fill="#f8fafc"/>
      <text x="24" y="30" class="pill">Visit softquorra.com</text>
      <path d="M208 23 L222 23 M216 15 L224 23 L216 31" fill="none" stroke="#06131f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g>
    <path class="line dash" d="M770 118 C858 76 956 88 1038 146 C1086 180 1118 236 1090 300"/>
    <path class="line dash" d="M784 298 C858 250 924 239 1004 258 C1044 268 1073 284 1090 300"/>
    <path class="line dash" d="M770 118 C810 183 807 244 784 298"/>

    <circle cx="770" cy="118" r="15" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="13;17;13" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="798" y="124" class="label">GPT Skills</text>
    <text x="798" y="152" class="small">role systems</text>

    <circle cx="1010" cy="130" r="15" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="13;17;13" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1038" y="136" class="label">Codex</text>
    <text x="1038" y="164" class="small">build work</text>

    <circle cx="1090" cy="300" r="15" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="13;17;13" dur="3.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="932" y="306" class="label">AI Agents</text>
    <text x="932" y="334" class="small">automation</text>

    <circle cx="784" cy="298" r="15" fill="#a78bfa" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="13;17;13" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="812" y="304" class="label">SaaS</text>
    <text x="812" y="332" class="small">software launch</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
</svg>
